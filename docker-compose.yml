services:
  deep_agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: deep_agent:local
    container_name: deep_agent
    env_file:
      - .env
    environment:
      # Single-domain reference. Database is the literal value of MONGODB_DB.
      MONGODB_DB: ${MONGODB_DB:-deep_agents}
      # Origin the frontend nginx serves — backend's CORS allowlist uses this
      # when ALLOW_INSECURE=false. Override for non-localhost deployments.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # Per-turn wall-clock budget for /chat. The default in Settings is
      # 180s, which is too tight when the planner + researcher do KB
      # search + URL fetches. Default the deployed image to 10 minutes;
      # override with CHAT_TURN_TIMEOUT_S in the host environment.
      CHAT_TURN_TIMEOUT_S: ${CHAT_TURN_TIMEOUT_S:-600}
      # LangGraph super-step ceiling. The default in Settings is 50,
      # which the planner blows through on a 4-todo report (write_todos
      # + per-todo task() + tool calls inside the researcher). Default
      # to 150 in the deployed image.
      RECURSION_LIMIT: ${RECURSION_LIMIT:-150}
    ports:
      # Backend is on 8000 inside the container; expose 8010 by default.
      # Override with DEEP_AGENT_PORT if that's busy.
      - "${DEEP_AGENT_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deep_agent_frontend:local
    container_name: deep_agent_frontend
    depends_on:
      deep_agent:
        condition: service_healthy
    ports:
      # nginx listens on 3000; proxies /api/* to deep_agent:8000.
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
