version: 2
updates:
  # Keep GitHub Actions SHA pins up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Keep Python dependencies current. Group minor/patch updates to reduce PR noise.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the Docker base image current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
