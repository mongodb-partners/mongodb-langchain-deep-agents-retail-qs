# Continuous integration: lint + type-check + unit tests.
#
# Integration tests (tests/integration/) are GATED on ATLAS_URI and are NOT
# run here by default; see integration.yml for the opt-in workflow operators
# can trigger manually against a real Atlas cluster.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: we only read source to run tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff
        run: uv run ruff check src tests streaming/producer.py

      - name: Mypy (strict)
        run: uv run mypy --strict src

      - name: Pytest (unit tier only)
        # -m 'not integration' is already the default via pyproject addopts,
        # but pass it explicitly so a future addopts change won't silently
        # start hammering a production Atlas cluster from CI.
        run: uv run pytest -m 'not integration' --strict-markers -ra
